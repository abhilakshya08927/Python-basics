<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daily Python Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: lab-notebook — lesson page on the left, workbench (problem + editor + console) on the right; stacks on phones. */
:root{
  --bg:#EEF1EE; --paper:#FBFCFA; --ink:#17201C; --muted:#5B6862; --line:#D5DCD7; --grid:#E4EAE5;
  --accent:#1F4FD1; --accent-ink:#FFFFFF; --mark:#F5D547; --mark-ink:#2A2300;
  --ok:#17804A; --ok-bg:#E2F3E8; --bad:#B42318; --bad-bg:#FBE7E4; --warn-bg:#FFF4D6;
  --code-bg:#1B2420; --code-ink:#E6EEE9; --code-dim:#7D8C85;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "Cascadia Code", Consolas, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111613; --paper:#18201C; --ink:#E4EBE6; --muted:#98A69F; --line:#2B3530; --grid:#1E2723;
  --accent:#7B9CFF; --accent-ink:#0B1230; --mark:#E9C933; --mark-ink:#241D00;
  --ok:#5CCB8C; --ok-bg:#15301F; --bad:#FF8A7A; --bad-bg:#3A1A16; --warn-bg:#352C10;
  --code-bg:#0C110E; --code-ink:#DDE7E1; --code-dim:#6C7A73; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111613; --paper:#18201C; --ink:#E4EBE6; --muted:#98A69F; --line:#2B3530; --grid:#1E2723;
  --accent:#7B9CFF; --accent-ink:#0B1230; --mark:#E9C933; --mark-ink:#241D00;
  --ok:#5CCB8C; --ok-bg:#15301F; --bad:#FF8A7A; --bad-bg:#3A1A16; --warn-bg:#352C10;
  --code-bg:#0C110E; --code-ink:#DDE7E1; --code-dim:#6C7A73; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:16px/1.6 var(--f-body);margin:0}
.wrap{max-width:1320px;margin:0 auto;padding-inline:16px;padding-block:0 48px}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0}
a{color:var(--accent)}
code{font-family:var(--f-mono);font-size:.88em;background:var(--grid);padding:.08em .35em;border-radius:4px}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.eyebrow{font:600 12px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding-block:12px}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto}
.brand h1{font-size:22px;font-weight:800;letter-spacing:-.01em}
.brand .prompt{font-family:var(--f-mono);color:var(--accent);font-weight:600}
nav.tabs{display:flex;flex-wrap:wrap;gap:4px;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:3px}
nav.tabs button{border:0;background:transparent;color:var(--muted);padding:6px 14px;border-radius:999px;font-weight:700;font-size:14px}
nav.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.meters{display:flex;gap:16px;align-items:center;font-size:14px}
.meter{display:flex;flex-direction:column;gap:4px;min-width:120px}
.meter b{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .4s}
.streak{display:flex;align-items:center;gap:8px;background:var(--mark);color:var(--mark-ink);border-radius:8px;padding:6px 10px;font-weight:700}
.streak span{font:800 20px/1 var(--f-display);font-variant-numeric:tabular-nums}

/* day view */
.dayhead{display:flex;flex-wrap:wrap;align-items:end;gap:12px 24px;padding-block:28px 18px}
.dayhead .num{font:800 clamp(56px,9vw,96px)/.8 var(--f-display);color:var(--accent);font-variant-numeric:tabular-nums;letter-spacing:-.04em}
.dayhead .t{flex:1;min-width:220px}
.dayhead h2{font-size:clamp(26px,3.4vw,38px);font-weight:800;letter-spacing:-.015em;margin-top:6px}
.daynav{display:flex;gap:8px}
.btn{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:8px;padding:8px 14px;font-weight:700;font-size:14px}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.45;cursor:default}
.grid2{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:20px;align-items:start}
@media (max-width:980px){.grid2{grid-template-columns:minmax(0,1fr)}}

.lesson{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:24px;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px);background-size:100% 28px;background-position:0 12px}
.lesson > *{max-width:62ch}
.lesson p,.lesson ul,.lesson ol{margin:0 0 14px}
.lesson pre,.example pre{font:14px/1.55 var(--f-mono);background:var(--code-bg);color:var(--code-ink);padding:12px 14px;border-radius:8px;overflow-x:auto;margin:0 0 14px;max-width:100%}
.lesson pre code{background:none;padding:0}
table.ops{border-collapse:collapse;margin:0 0 14px;font-size:15px;background:var(--paper);display:block;overflow-x:auto}
table.ops td{border-bottom:1px solid var(--line);padding:6px 12px 6px 0;vertical-align:top}
table.ops td:first-child{white-space:nowrap}
.example{margin-top:18px;border-top:1px dashed var(--line);padding-top:16px}
.example .row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.watch{margin-top:18px;border-top:1px dashed var(--line);padding-top:16px}
.watch ul{list-style:none;padding:0;margin:8px 0 0;display:grid;gap:6px}
.watch a{display:flex;gap:10px;align-items:baseline;text-decoration:none;color:var(--ink);padding:6px 8px;border-radius:6px;background:var(--bg)}
.watch a:hover{outline:1px solid var(--accent)}
.watch a small{color:var(--muted)}
.watch .play{font:600 11px/1 var(--f-mono);color:var(--accent);flex:none}

.bench{display:flex;flex-direction:column;gap:14px;min-width:0}
.ptabs{display:flex;gap:8px;flex-wrap:wrap}
.ptab{flex:1;min-width:140px;text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:8px 12px;color:var(--ink)}
.ptab small{display:block;font:600 11px/1.3 var(--f-mono);color:var(--muted);letter-spacing:.04em}
.ptab .pt{font-weight:700;font-size:14px}
.ptab[aria-selected="true"]{border-color:var(--ink);box-shadow:inset 0 -3px 0 var(--ink)}
.ptab.solved small{color:var(--ok)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.prompt-text p{margin:0}
.prompt-text pre{font:14px/1.5 var(--f-mono);background:var(--bg);padding:8px 12px;border-radius:6px;margin:8px 0 0;overflow-x:auto}
.ptype{display:inline-block;font:600 11px/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;padding:4px 6px;border-radius:4px;background:var(--bg);color:var(--muted);margin-bottom:10px}

.editor{display:flex;background:var(--code-bg);border-radius:var(--r);overflow:hidden;min-height:260px}
.gutter{font:14px/1.6 var(--f-mono);color:var(--code-dim);text-align:right;padding:12px 8px 12px 12px;user-select:none;white-space:pre;overflow:hidden;flex:none}
textarea#code{flex:1;min-width:0;border:0;outline:0;resize:vertical;background:transparent;color:var(--code-ink);font:14px/1.6 var(--f-mono);padding:12px 12px 12px 4px;min-height:260px;tab-size:4;white-space:pre;overflow:auto;caret-color:var(--mark)}
.editor:focus-within{box-shadow:0 0 0 3px var(--accent)}
.stdin{display:grid;gap:6px}
.stdin label{font-size:13px;color:var(--muted)}
textarea#stdin{font:14px/1.5 var(--f-mono);border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:8px;padding:8px 10px;min-height:44px;resize:vertical;width:100%}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.actions .sp{flex:1}
.kbd{font:12px var(--f-mono);color:var(--muted)}
.console{font:14px/1.55 var(--f-mono);background:var(--code-bg);color:var(--code-ink);border-radius:var(--r);padding:12px 14px;min-height:64px;max-height:320px;overflow:auto;white-space:pre-wrap;word-break:break-word}
.console .err{color:#FF9B8E}
.console .dim{color:var(--code-dim)}
.helpbox{border-radius:8px;padding:10px 14px;background:var(--warn-bg);font-size:15px}
.results{display:grid;gap:8px}
.res{border-radius:8px;padding:10px 12px;font-size:14px;display:grid;gap:4px;min-width:0}
.res.ok{background:var(--ok-bg)}
.res.bad{background:var(--bad-bg)}
.res .h{font-weight:700;display:flex;gap:8px;align-items:center}
.res .h .tag{font:700 11px/1 var(--f-mono);padding:3px 6px;border-radius:4px;color:var(--paper)}
.res.ok .tag{background:var(--ok)} .res.bad .tag{background:var(--bad)}
.res pre{font:13px/1.45 var(--f-mono);margin:0;white-space:pre-wrap;word-break:break-word}
.verdict{font:800 20px/1.2 var(--f-display)}
.verdict.ok{color:var(--ok)}
.solution pre{font:14px/1.55 var(--f-mono);background:var(--code-bg);color:var(--code-ink);padding:12px 14px;border-radius:8px;overflow-x:auto;margin:8px 0 0}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px}

/* practice */
.phead{display:flex;flex-wrap:wrap;gap:16px 24px;align-items:end;padding-block:28px 16px}
.phead .t{flex:1;min-width:240px}
.phead h2{font-size:clamp(26px,3.4vw,38px);font-weight:800;letter-spacing:-.015em;margin-top:6px}
.phead .sub{color:var(--muted);margin:6px 0 0;max-width:60ch}
.potd{border:0;background:var(--mark);color:var(--mark-ink);border-radius:var(--r);padding:12px 16px;text-align:left;display:grid;gap:2px;min-width:230px}
.potd .eyebrow{color:var(--mark-ink);opacity:.75}
.potd b{font:800 19px/1.2 var(--f-display)}
.potd small{font:600 11px var(--f-mono);letter-spacing:.04em}
.topics{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.topic{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:7px 14px;font-weight:700;font-size:14px;display:flex;gap:8px;align-items:center}
.topic small{font:600 11px var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.topic[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.topic[aria-selected="true"] small{color:var(--bg);opacity:.7}
.topic.done small{color:var(--ok)}
.pgrid{grid-template-columns:minmax(0,4fr) minmax(0,7fr)}
@media (max-width:980px){.pgrid{grid-template-columns:minmax(0,1fr)}}
.ptopic{background-image:none}
.plist{display:grid;gap:6px;max-width:none}
.plist button{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:8px 10px;font-size:15px}
.plist button[aria-selected="true"]{border-color:var(--ink);background:var(--paper);box-shadow:inset 3px 0 0 var(--ink)}
.plist .ck{color:var(--ok);font-weight:700}
.lv{font:700 10px/1 var(--f-mono);letter-spacing:.06em;padding:4px 6px;border-radius:4px;width:58px;text-align:center;display:inline-block}
.lv1{background:var(--ok-bg);color:var(--ok)} .lv2{background:var(--warn-bg);color:var(--mark-ink)} .lv3{background:var(--bad-bg);color:var(--bad)}
:root[data-theme="dark"] .lv2{color:var(--mark)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .lv2{color:var(--mark)}}
.ptitle{font-size:22px;display:flex;gap:10px;align-items:center;scroll-margin-top:90px}

/* all days */
.weeks{display:grid;gap:28px;padding-block:28px}
.week h3{font-size:20px;margin-bottom:12px}
.week h3 small{font:600 12px var(--f-mono);color:var(--muted);margin-left:8px;letter-spacing:.04em}
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.daytile{text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:var(--r);padding:12px 14px;color:var(--ink);display:grid;gap:6px}
.daytile:hover{border-color:var(--ink)}
.daytile .dn{font:800 28px/1 var(--f-display);color:var(--muted);font-variant-numeric:tabular-nums}
.daytile .tt{font-weight:700;font-size:15px;line-height:1.3}
.daytile .dots{display:flex;gap:4px}
.daytile .dots i{width:18px;height:6px;border-radius:3px;background:var(--line)}
.daytile .dots i.on{background:var(--ok)}
.daytile.done .dn{color:var(--ok)}
.daytile.today{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.daytile.today .dn{color:var(--accent)}

/* resources */
.res-intro{max-width:70ch;padding-block:28px 8px}
.res-intro h2{font-size:32px;font-weight:800;margin-bottom:8px}
.res-intro p{color:var(--muted);margin:0}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;padding-block:18px}
.rcard{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:8px}
.rcard.pick{border-color:var(--accent)}
.rcard h3{font-size:19px}
.rcard .who{font-size:14px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:600 11px/1 var(--f-mono);padding:4px 7px;border-radius:4px;background:var(--bg);color:var(--muted);letter-spacing:.03em}
.chip.pick{background:var(--mark);color:var(--mark-ink)}
.rcard p{margin:0;font-size:15px}
.rcard .links{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto;padding-top:6px}
.plan{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:18px;max-width:80ch}
.plan ol{margin:8px 0 0;padding-left:20px}
.foot{color:var(--muted);font-size:13px;padding-block:24px;display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between}
.linkbtn{border:0;background:none;color:var(--muted);text-decoration:underline;padding:0;font-size:13px}
@media (max-width:640px){.meter{min-width:90px}.lesson{padding:18px}.top .wrap{gap:10px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="brand"><span class="prompt">&gt;&gt;&gt;</span><h1>Daily Python Lab</h1></div>
    <nav class="tabs" role="tablist" aria-label="Sections">
      <button role="tab" id="tab-today" data-view="today" aria-selected="true">Today</button>
      <button role="tab" id="tab-practice" data-view="practice" aria-selected="false">Practice</button>
      <button role="tab" id="tab-days" data-view="days" aria-selected="false">All 30 days</button>
      <button role="tab" id="tab-res" data-view="res" aria-selected="false">Resources</button>
    </nav>
    <div class="meters">
      <div class="meter"><span class="eyebrow">Solved</span><b id="solvedTxt">0 / 90</b><div class="bar"><i id="solvedBar"></i></div></div>
      <div class="streak" title="Days in a row with at least one problem solved"><span id="streakNum">0</span> day streak</div>
    </div>
  </div>
</header>

<main class="wrap">
  <section id="view-today"></section>
  <section id="view-practice" hidden></section>
  <section id="view-days" hidden></section>
  <section id="view-res" hidden></section>
  <div class="foot">
    <span>Python runs in your browser (Skulpt). Progress is saved on this device.</span>
    <span id="resetArea"><button class="linkbtn" id="resetBtn" type="button">Reset all progress</button></span>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt-stdlib.js"></script>
<script>
// 30-day Python-from-zero curriculum.
// Problem types:
//   output: program's printed output must match `cases[i].expected` (inputs fed to input()).
//   func:   `tests` = [pythonExpression, expectedRepr]; the expression is run after the user's code.
const W = (src, q) => ({ src, q });
const CS50 = (n, t) => W("CS50P · Lecture " + n + " · " + t, "CS50P lecture " + n + " " + t);
const CWH = (q) => W("CodeWithHarry (Hindi)", "CodeWithHarry python " + q);
const CHUCK = (q) => W("Dr. Chuck · Python for Everybody", "Python for Everybody Dr Chuck " + q);

const COURSE = [
// ───────────────────────── WEEK 1 · Talking to the computer
{
  day: 1, week: 1, title: "Your first program", topic: "print()",
  lesson: `
<p>A program is a list of instructions the computer follows <b>top to bottom, one line at a time</b>. Python is a language that reads almost like English, which is why it's the best first language.</p>
<p>The first instruction everyone learns is <code>print()</code>. Whatever you put inside the brackets appears on the screen. Text must be inside quotes, so Python knows it's text and not a command.</p>
<pre>print("Hello, world!")
print("I am learning Python")
print(2 + 3)</pre>
<p>Line 3 has no quotes, so Python <i>calculates</i> it and prints <code>5</code>. With quotes, <code>print("2 + 3")</code> would print the text <code>2 + 3</code> exactly.</p>
<p><b>Rules to remember:</b> brackets must open and close, quotes must open and close, and capital letters matter (<code>Print</code> is not <code>print</code>).</p>
<p>Press <b>Run</b> (or Ctrl + Enter) to run your code. Mistakes are normal. Read the red error message; it tells you the line number.</p>`,
  example: 'print("Hello, world!")\nprint("I am learning Python")\nprint(2 + 3)',
  watch: [CS50(0, "functions variables"), CWH("tutorial day 1 introduction"), CHUCK("why program")],
  problems: [
    { id: "d1p1", title: "Say hello", type: "output",
      prompt: "Print exactly <code>Hello, Python!</code>",
      starter: "# Write your code below\n",
      cases: [{ expected: "Hello, Python!" }],
      hint: "print(\"...\") with the text inside the quotes. Check the comma and the exclamation mark.",
      solution: 'print("Hello, Python!")' },
    { id: "d1p2", title: "Three lines", type: "output",
      prompt: "Print these three lines, in this order:<pre>Name: Ravi\nCollege: JNVU\nYear: 2</pre>",
      starter: "",
      cases: [{ expected: "Name: Ravi\nCollege: JNVU\nYear: 2" }],
      hint: "Use three separate print() lines.",
      solution: 'print("Name: Ravi")\nprint("College: JNVU")\nprint("Year: 2")' },
    { id: "d1p3", title: "Let Python do the math", type: "output",
      prompt: "Print the result of <code>365 * 24</code> (hours in a year). Let Python calculate it; don't type the answer yourself.",
      starter: "",
      cases: [{ expected: "8760" }],
      hint: "No quotes around the maths: print(365 * 24)",
      solution: "print(365 * 24)" },
  ]
},
{
  day: 2, week: 1, title: "Variables: giving names to values", topic: "variables & types",
  lesson: `
<p>A <b>variable</b> is a labelled box that holds a value. You create one with <code>=</code>, which in Python means "store", not "equals".</p>
<pre>name = "Ravi"
age = 19
cgpa = 8.4
is_student = True</pre>
<p>These are the four basic <b>types</b>:</p>
<ul><li><code>str</code> (string): text, in quotes: <code>"Ravi"</code></li>
<li><code>int</code> (integer): whole numbers: <code>19</code></li>
<li><code>float</code>: numbers with a decimal point: <code>8.4</code></li>
<li><code>bool</code>: <code>True</code> or <code>False</code></li></ul>
<p>You can print a variable by its name (no quotes), and <code>print</code> can take several things separated by commas; it puts a space between them:</p>
<pre>print("My name is", name)
print(type(age))</pre>
<p>Variables can change: <code>age = age + 1</code> reads the old value, adds 1, and stores it back. Names can't start with a digit or contain spaces; use <code>snake_case</code> like <code>total_marks</code>.</p>`,
  example: 'name = "Ravi"\nage = 19\nprint("My name is", name)\nprint("Next year I will be", age + 1)\nprint(type(age))',
  watch: [CS50(0, "functions variables"), CWH("variables and data types"), CHUCK("variables expressions statements")],
  problems: [
    { id: "d2p1", title: "Introduce yourself", type: "output",
      prompt: "Create a variable <code>city</code> holding <code>\"Jodhpur\"</code>, then print <code>I live in Jodhpur</code> using the variable (not by typing Jodhpur in the print).",
      starter: 'city = \n',
      cases: [{ expected: "I live in Jodhpur" }],
      hint: 'print("I live in", city) — the comma adds the space for you.',
      solution: 'city = "Jodhpur"\nprint("I live in", city)' },

  day: 11, week: 2, title: "Repeating with for", topic: "for loops & range()",
  lesson: `
<p>When you know how many times to repeat, <code>for</code> is simpler. <code>range()</code> produces a sequence of numbers:</p>
<pre>for i in range(5):        # 0, 1, 2, 3, 4
    print(i)

for i in range(1, 6):     # 1 to 5 (the end is NOT included)
    print(i)

for i in range(0, 20, 5): # 0, 5, 10, 15 (step of 5)

<p>The rule: <code>range(start, stop)</code> goes up to but <b>not including</b> stop. For 1 to n, write <code>range(1, n + 1)</code>.</p>

  lesson: `
<p>Most loop problems use one of a few patterns. Learn them and you can solve hundreds of problems.</p>
<p><b>1. Accumulator</b>: start at 0, add inside the loop.</p>
<pre>total = 0
for i in range(1, 101):
    total += i
print(total)   # 5050</pre>
<p><b>2. Counter</b>: count how many things match a condition.</p>
<pre>count = 0
for ch in "programming":
    if ch in "aeiou":
        count += 1
print(count)   # 3</pre>
<p><b>3. Product</b>: start at <b>1</b> (not 0!) and multiply. That's how factorial works: 5! = 1×2×3×4×5.</p>

<p><code>break</code> exits a loop immediately. <code>continue</code> skips the rest of this round and jumps to the next.</p>
<pre>for n in range(1, 20):
    if n % 7 == 0:
        print("First multiple of 7:", n)
        break

for n in range(1, 8):
    if n == 4:
        continue      # skip 4
    print(n, end=" ")   # 1 2 3 5 6 7</pre>
<p><b>Prime numbers</b> are the classic use of break: to test if n is prime, try dividing by 2, 3, 4 ... If anything divides evenly, it's not prime; stop looking.</p>
<p>You only need to check up to the square root of n (if n = a×b, one of them is ≤ √n), which makes the check much faster: <code>while d * d <= n</code>.</p>

<p><code>print</code> shows something on screen. <code>return</code> <b>hands a value back</b> to whoever called the function, so they can store it, use it in maths, or pass it to another function.</p>
<pre>def square(n):
    return n * n

x = square(4)          # x is 16

<p>A function that only prints can't be used in a calculation; <code>square(4) + 1</code> would fail if square just printed. That's why nearly all useful functions <b>return</b>.</p>

<p>The single most useful dictionary pattern is <b>counting</b>: how many times does each thing appear?</p>

<pre>squares = []

<p>A <b>list comprehension</b> says the same in one line:</p>
<pre>squares = [n * n for n in range(1, 6)]    # [1, 4, 9, 16, 25]</pre>
<p>Read it as "<i>n × n</i> for each <i>n</i> in the range". Add a filter with <code>if</code> at the end:</p>
<pre>evens = [n for n in range(20) if n % 2 == 0]

<p>Dictionary comprehensions exist too: <code>{w: len(w) for w in names}</code>.</p>
<p>Use comprehensions for simple transform/filter jobs. If it gets hard to read, a normal loop is better.</p>`,

  day: 26, week: 4, title: "Handling errors", topic: "try / except",
  lesson: `
<p>Programs meet bad data: a user types "abc" where a number was expected, a key is missing, someone divides by zero. Without handling, the program crashes. <code>try/except</code> lets you catch the error and respond:</p>
<pre>text = "abc"
try:
    n = int(text)
    print("Number:", n)
except ValueError:
    print("That's not a number")</pre>
<p>Common error types to recognise:</p>
<table class="ops"><tr><td><code>ValueError</code></td><td>right type, bad value: <code>int("abc")</code></td></tr>
<tr><td><code>ZeroDivisionError</code></td><td><code>5 / 0</code></td></tr>
<tr><td><code>KeyError</code></td><td>missing dictionary key</td></tr>
<tr><td><code>IndexError</code></td><td>list position that doesn't exist</td></tr>
<tr><td><code>TypeError</code></td><td>wrong type: <code>"a" + 1</code></td></tr>
<tr><td><code>NameError</code></td><td>misspelt variable name</td></tr></table>
<p>Only wrap the lines that can actually fail, and catch the specific error. A bare <code>except:</code> hides real bugs.</p>
<p>Reading error messages is a skill: the <b>last line</b> says what went wrong, and the line number says where.</p>`,

<p>A <b>recursive</b> function solves a problem by calling itself on a <b>smaller</b> version of the same problem. It needs two parts:</p>
<ol><li><b>Base case</b>: the tiny version you can answer directly, which stops the recursion.</li>
<li><b>Recursive case</b>: shrink the problem and call yourself.</li></ol>
<pre>def factorial(n):
    if n <= 1:                     # base case
        return 1
    return n * factorial(n - 1)    # smaller problem</pre>
<p>Trace <code>factorial(4)</code>: 4 × factorial(3) → 4 × 3 × factorial(2) → 4 × 3 × 2 × factorial(1) → 4 × 3 × 2 × 1 = 24.</p>

<p>An <b>algorithm</b> is a step-by-step method. Two you'll meet in every DSA course:</p>
<p><b>Linear search</b>: check items one by one. Simple, works on anything, slow for big lists.</p>
<p><b>Binary search</b>: works only on a <b>sorted</b> list. Look at the middle; if the target is smaller, throw away the right half, else the left half. Repeat. A million items take only about 20 steps.</p>
<pre>def binary_search(nums, target):
    lo, hi = 0, len(nums) - 1
    while lo <= hi:
        mid = (lo + hi) // 2
        if nums[mid] == target:
            return mid
        elif nums[mid] < target:
            lo = mid + 1
        else:
            hi = mid - 1
    return -1</pre>
<p><b>Bubble sort</b>: repeatedly swap neighbours that are in the wrong order. Slow, but it teaches how sorting works. In real code use <code>sorted()</code>, and <code>sorted(items, key=...)</code> to sort by something specific, like <code>key=len</code> or <code>key=lambda s: s[1]</code>.</p>`,

<script>

  const set=new Set(S.days);let n=0;const d=new Date();

    if(set.has(k)){n++;d.setDate(d.getDate()-1);}else break;}

    let out="",i=0;
    Sk.configure({output:t=>{out+=t;},read:f=>{if(Sk.builtinFiles===undefined||Sk.builtinFiles.files[f]===undefined)throw "File not found: '"+f+"'";return Sk.builtinFiles.files[f];},
      __future__:Sk.python3,inputfunTakesPrompt:true,inputfun:()=>i<inputs.length?inputs[i++]:"",execLimit:4000});
    Sk.misceval.asyncToPromise(()=>Sk.importMainWithBody("<stdin>",false,code,true))
      .then(()=>resolve({out}),e=>resolve({out,err:e.toString()}));
  });
}
function norm(s){return s.replace(/\r/g,"").split("\n").map(l=>l.replace(/\s+$/,"")).join("\n").replace(/\n+$/,"");}
async function grade(p,code){
  const res=[];
  if(p.type==="output"){
    for(const c of p.cases){const r=await run(code,c.inputs||[]);
      res.push({ok:!r.err&&norm(r.out)===norm(c.expected),got:r.out,err:r.err,expected:c.expected,inputs:c.inputs||[]});}
  }else{
    for(const [expr,exp] of p.tests){const r=await run(code+'\n\nprint("@@R@@" + repr('+expr+'))',[]);
      let got=null;const m=r.out.split("\n").filter(l=>l.startsWith("@@R@@"));if(m.length)got=m[m.length-1].slice(5);
      res.push({ok:!r.err&&got===exp,got,err:r.err,expected:exp,call:expr});}
  }
  return res;
}

    <div class="t"><div class="eyebrow">Day ${d.day} of 30 · Week ${d.week} · ${esc(d.topic)}</div><h2>${esc(d.title)}</h2></div>
    <div class="daynav">
      <button class="btn" id="prevDay" ${d.day===1?"disabled":""}>← ${d.day>1?"Day "+(d.day-1):"Start"}</button>
      <button class="btn" id="nextDay" ${d.day===30?"disabled":""}>Day ${d.day<30?d.day+1:""} →</button>
    </div>
  </div>
  <div class="grid2">
    <article class="lesson">
      <div class="eyebrow" style="margin-bottom:12px">Learn · about 15 minutes</div>
      ${d.lesson}
      <div class="example">
        <div class="row"><span class="eyebrow">Example to run</span><button class="btn" id="tryEx">Open in editor</button></div>
        <pre>${esc(d.example)}</pre>
      </div>
      <div class="watch">
        <span class="eyebrow">Watch (opens YouTube)</span>
        <ul>${d.watch.map(w=>`<li><a href="${ytq(w.q)}" target="_blank" rel="noopener"><span class="play">▶ VIDEO</span><span>${esc(w.src)}</span></a></li>`).join("")}</ul>
      </div>
      ${PRACTICE.filter(x=>x.after===d.day).map(x=>`<div class="watch"><span class="eyebrow">Want more?</span>
        <p style="margin:6px 0 8px">${x.problems.length} extra ${esc(x.name.toLowerCase())} problems, easy to hard, are in the Practice tab.</p>
        <button class="btn primary morep" data-k="${x.key}">Practise ${esc(x.name.toLowerCase())} →</button></div>`).join("")}
    </article>
    <div class="bench">
      <div class="ptabs" role="tablist" aria-label="Problems">${d.problems.map((p,i)=>`
        <button class="ptab ${S.solved[p.id]?"solved":""}" role="tab" data-i="${i}" aria-selected="${i===pIdx}">
          <small>PROBLEM ${i+1} ${S.solved[p.id]?"· SOLVED ✓":""}</small><span class="pt">${esc(p.title)}</span></button>`).join("")}
      </div>
${BENCH}
    </div>
  </div>`;
  $("#prevDay").onclick=()=>renderDay(d.day-1);
  document.querySelectorAll(".morep").forEach(b=>b.onclick=()=>{storeCode();S.ptopic=b.dataset.k;mounted="";show("practice");});
  $("#nextDay").onclick=()=>renderDay(d.day+1);
  document.querySelectorAll(".ptab").forEach(b=>b.onclick=()=>{storeCode();pIdx=+b.dataset.i;S.prob[d.day]=pIdx;save();renderProblem();});
  $("#tryEx").onclick=()=>{storeCode();loadCode(d.example);$("#stdin").value=d.exampleInput||"";$("#console").innerHTML='<span class="dim">Example loaded. Press Run. (Your problem code is saved; click the problem tab to get it back.)</span>';exampleMode=true;$("#code").focus();};
  bindBench();
  renderProblem();
  window.scrollTo(0,0);
}
function bindBench(){
  setupEditor();
  $("#runBtn").onclick=doRun;$("#checkBtn").onclick=doCheck;
  $("#hintBtn").onclick=()=>{$("#help").innerHTML=`<div class="helpbox"><b>Hint:</b> ${esc(prob().hint)}</div>`;};
  $("#solBtn").onclick=askSolution;
  $("#resetCode").onclick=()=>{loadCode(prob().starter);storeCode();};
}
let exampleMode=false;
const prob=()=>cur.problems[pIdx];
function renderProblem(){
  exampleMode=false;
  const p=prob();
  document.querySelectorAll(".ptab,.plist button").forEach((b,i)=>b.setAttribute("aria-selected",i===pIdx));
  const how=p.type==="output"?"Checked by comparing your printed output":"Checked by calling your "+(/^[A-Z]/.test(p.fn)?"class":"function")+" with test values";
  $("#promptCard").innerHTML=`<span class="ptype">${how}</span><p>${p.prompt}</p>`;
  if($("#ptitle"))$("#ptitle").innerHTML=`<span class="lv lv${p.level}">${LV[p.level]}</span> ${esc(p.title)}`;
  loadCode(S.code[p.id]!=null?S.code[p.id]:p.starter);
  $("#stdinWrap").hidden=!(p.type==="output"&&p.cases.some(c=>c.inputs&&c.inputs.length));
  $("#stdin").value=p.type==="output"&&p.cases[0].inputs?p.cases[0].inputs.join("\n"):"";
  $("#help").innerHTML="";$("#results").innerHTML="";
  $("#console").innerHTML='<span class="dim">Output appears here.</span>';
}
function storeCode(){if(!cur||exampleMode)return;S.code[prob().id]=$("#code").value;save();}

// ---------- editor ----------
function loadCode(t){const ta=$("#code");ta.value=t;syncGutter();}
function syncGutter(){const ta=$("#code"),n=ta.value.split("\n").length;$("#gutter").textContent=Array.from({length:n},(_,i)=>i+1).join("\n");$("#gutter").scrollTop=ta.scrollTop;}
function setupEditor(){
  const ta=$("#code");let t;
  ta.addEventListener("input",()=>{syncGutter();clearTimeout(t);t=setTimeout(storeCode,400);});
  ta.addEventListener("scroll",()=>{$("#gutter").scrollTop=ta.scrollTop;});
  ta.addEventListener("keydown",e=>{
    const v=ta.value,s=ta.selectionStart,en=ta.selectionEnd;
    if((e.ctrlKey||e.metaKey)&&e.key==="Enter"){e.preventDefault();doRun();return;}
    if(e.key==="Tab"){
      e.preventDefault();
      const ls=v.lastIndexOf("\n",s-1)+1;
      if(e.shiftKey){
        const le=v.indexOf("\n",en-1)===-1?v.length:v.indexOf("\n",Math.max(en-1,s));
        const block=v.slice(ls,le);const out=block.split("\n").map(l=>l.replace(/^ {1,4}/,"")).join("\n");
        ta.value=v.slice(0,ls)+out+v.slice(le);ta.selectionStart=ls;ta.selectionEnd=ls+out.length;
      }else if(s!==en&&v.slice(s,en).includes("\n")){
        const le=v.indexOf("\n",en-1)===-1?v.length:v.indexOf("\n",en-1);
        const out=v.slice(ls,le).split("\n").map(l=>"    "+l).join("\n");
        ta.value=v.slice(0,ls)+out+v.slice(le);ta.selectionStart=ls;ta.selectionEnd=ls+out.length;
      }else{ta.setRangeText("    ",s,en,"end");}
      syncGutter();storeCode();return;
    }
    if(e.key==="Enter"&&!e.shiftKey){
      const ls=v.lastIndexOf("\n",s-1)+1;const line=v.slice(ls,s);
      let ind=(line.match(/^\s*/)||[""])[0];if(/:\s*(#.*)?$/.test(line))ind+="    ";
      e.preventDefault();ta.setRangeText("\n"+ind,s,en,"end");syncGutter();storeCode();
    }
    if(e.key==="Backspace"&&s===en){
      const ls=v.lastIndexOf("\n",s-1)+1;const before=v.slice(ls,s);
      if(before.length>0&&/^ +$/.test(before)&&before.length%4===0){e.preventDefault();ta.setRangeText("",s-4,s,"end");syncGutter();}
    }
  });
}

// ---------- run / check ----------
function showOutput(r){
  const c=$("#console");
  let h=r.out?esc(r.out):(r.err?"":'<span class="dim">(no output — did you forget print?)</span>');
  if(r.err){h+=`<span class="err">${esc(r.err)}</span>`;}
  c.innerHTML=h;
  const t=r.err?tip(r.err):"";
  $("#help").innerHTML=t?`<div class="helpbox"><b>What this error usually means:</b> ${esc(t)}</div>`:"";
}
async function doRun(){
  const b=$("#runBtn");b.disabled=true;$("#console").innerHTML='<span class="dim">Running…</span>';
  const inputs=$("#stdin").value.replace(/\n$/,"").split("\n");
  const r=await run($("#code").value,$("#stdin").value?inputs:[]);
  showOutput(r);b.disabled=false;
}
async function doCheck(){
  if(exampleMode){$("#results").innerHTML='<div class="helpbox">This is the lesson example, not a problem. Click a problem tab above to check your answer.</div>';return;}
  const p=prob(),code=$("#code").value;storeCode();
  const b=$("#checkBtn");b.disabled=true;$("#results").innerHTML='<div class="kbd">Checking…</div>';
  const res=await grade(p,code);
  const all=res.every(x=>x.ok);
  const first=res.find(x=>x.err);
  if(first)showOutput({out:first.got&&p.type==="output"?first.got:"",err:first.err});
  let h=`<div class="verdict ${all?"ok":""}">${all?"All "+res.length+" tests passed. Solved!":res.filter(x=>x.ok).length+" of "+res.length+" tests passed"}</div>`;
  h+=res.map((x,i)=>{
    const label=p.type==="output"?(x.inputs.length?"Input: "+x.inputs.join(" ⏎ "):"Output"):x.call;
    if(x.ok)return `<div class="res ok"><div class="h"><span class="tag">PASS</span><span>${esc(label)}</span></div></div>`;
    const got=x.err?"Error: "+x.err:(p.type==="output"?(x.got||"(nothing printed)"):(x.got==null?"(nothing returned — did you use return?)":x.got));
    return `<div class="res bad"><div class="h"><span class="tag">FAIL</span><span>${esc(label)}</span></div>
      <div><span class="eyebrow">Expected</span><pre>${esc(x.expected)}</pre></div>
      <div><span class="eyebrow">Yours</span><pre>${esc(got)}</pre></div></div>`;
  }).join("");
  $("#results").innerHTML=h;b.disabled=false;
  if(all){
    if(!S.solved[p.id]){S.solved[p.id]=true;const t=today();if(!S.days.includes(t))S.days.push(t);save();}
    meters();
    if(cur.kind==="practice"){afterPracticeSolve();return;}
    const tab=document.querySelectorAll(".ptab")[pIdx];tab.classList.add("solved");tab.querySelector("small").textContent="PROBLEM "+(pIdx+1)+" · SOLVED ✓";
    const nextUnsolved=cur.problems.findIndex(q=>!S.solved[q.id]);
    let more="";
    if(nextUnsolved>=0)more=`<button class="btn primary" id="goNext">Next: problem ${nextUnsolved+1} →</button>`;
    else if(cur.day<30)more=`<div class="helpbox"><b>Day ${cur.day} complete.</b> Come back tomorrow for day ${cur.day+1}, or keep going now. Consistency beats speed.</div><button class="btn primary" id="goDay">Start day ${cur.day+1} →</button>`;
    else more=`<div class="helpbox"><b>All 30 days complete.</b> Check the Resources tab for what to learn next.</div>`;
    $("#results").insertAdjacentHTML("beforeend",`<div class="actions">${more}</div>`);
    if($("#goNext"))$("#goNext").onclick=()=>{pIdx=nextUnsolved;S.prob[cur.day]=pIdx;save();renderProblem();window.scrollTo({top:$(".bench").offsetTop-80});};
    if($("#goDay"))$("#goDay").onclick=()=>renderDay(cur.day+1);
  }else{
    S.fails[p.id]=(S.fails[p.id]||0)+1;save();
  }
}
function askSolution(){
  const p=prob();const tries=S.fails[p.id]||0;
  if(tries<2&&!S.solved[p.id]){
    $("#help").innerHTML=`<div class="helpbox confirm"><span>You've checked ${tries} time${tries===1?"":"s"}. Struggling a bit is how it sticks: try the hint and two checks first. Still want to see it?</span>
      <button class="btn" id="solYes">Show solution</button><button class="btn" id="solNo">Keep trying</button></div>`;
    $("#solYes").onclick=showSolution;$("#solNo").onclick=()=>{$("#help").innerHTML="";};
  }else showSolution();
}
function showSolution(){
  const p=prob();
  $("#help").innerHTML=`<div class="card solution"><span class="eyebrow">One possible solution</span><pre>${esc(p.solution)}</pre>
  <p style="margin:10px 0 0;font-size:14px">Read it line by line, then close this and type it yourself from memory. Copy-paste teaches nothing.</p></div>`;
}

// ---------- practice ----------
const LV={1:"EASY",2:"MEDIUM",3:"HARD"};
function potd(){ // problem of the day: same for everyone on a date, prefers unsolved
  const k=today();let h=0;for(const c of k)h=(h*31+c.charCodeAt(0))>>>0;
  const pool=ALLP.filter(p=>!S.solved[p.id]);const list=pool.length?pool:ALLP;
  return list[h%list.length];
}
function renderPractice(topicKey,pid){
  const t=PRACTICE.find(x=>x.key===topicKey)||PRACTICE[0];S.ptopic=t.key;save();
  cur={kind:"practice",topic:t,problems:t.problems,key:"p-"+t.key};
  pIdx=pid?Math.max(0,t.problems.findIndex(p=>p.id===pid)):(S.prob[cur.key]||0);S.prob[cur.key]=pIdx;save();
  $("#view-today").innerHTML="";mounted="practice";
  const pd=potd();const pdTopic=PRACTICE.find(x=>x.key===pd.topic);
  const nSolved=ALLP.filter(p=>S.solved[p.id]).length;
  $("#view-practice").innerHTML=`
  <div class="phead">
    <div class="t"><div class="eyebrow">${nSolved} of ${ALLP.length} practice problems solved</div><h2>Practice by topic</h2>
      <p class="sub">Extra problems for each topic, from easy to hard. Use them after the matching course day, or whenever a topic feels shaky.</p></div>
    <button class="potd" id="potd"><span class="eyebrow">Problem of the day</span><b>${esc(pd.title)}</b><small>${esc(pdTopic.name)} · ${LV[pd.level]}${S.solved[pd.id]?" · SOLVED ✓":""}</small></button>
  </div>
  <div class="topics" role="tablist" aria-label="Topics">${PRACTICE.map(x=>{const s=x.problems.filter(p=>S.solved[p.id]).length;
    return `<button class="topic ${s===x.problems.length?"done":""}" role="tab" data-k="${x.key}" aria-selected="${x.key===t.key}">${esc(x.name)}<small>${s}/${x.problems.length}</small></button>`}).join("")}</div>
  <div class="grid2 pgrid">
    <aside class="lesson ptopic">
      <div class="eyebrow">${esc(t.name)} · best after course day ${t.after}</div>
      <p style="margin:6px 0 14px">${esc(t.blurb)}</p>
      <div class="plist" role="tablist" aria-label="Problems">${t.problems.map((p,i)=>`
        <button role="tab" data-i="${i}" aria-selected="${i===pIdx}" class="${S.solved[p.id]?"solved":""}">
          <span class="lv lv${p.level}">${LV[p.level]}</span><span class="pt">${esc(p.title)}</span><span class="ck">${S.solved[p.id]?"✓":""}</span></button>`).join("")}</div>
    </aside>
    <div class="bench">
      <h3 class="ptitle" id="ptitle"></h3>
      ${BENCH}
    </div>
  </div>`;
  document.querySelectorAll(".topic").forEach(b=>b.onclick=()=>{storeCode();renderPractice(b.dataset.k);});
  document.querySelectorAll(".plist button").forEach(b=>b.onclick=()=>{storeCode();pIdx=+b.dataset.i;S.prob[cur.key]=pIdx;save();renderProblem();
    if(window.innerWidth<980)$("#ptitle").scrollIntoView({block:"start"});});
  $("#potd").onclick=()=>{storeCode();renderPractice(pd.topic,pd.id);$("#ptitle").scrollIntoView({block:"start"});};
  bindBench();
  renderProblem();
}
function afterPracticeSolve(){
  const b=document.querySelectorAll(".plist button")[pIdx];if(b){b.classList.add("solved");b.querySelector(".ck").textContent="✓";}
  const tb=document.querySelector('.topic[aria-selected="true"] small');if(tb)tb.textContent=cur.problems.filter(p=>S.solved[p.id]).length+"/"+cur.problems.length;
  const n=cur.problems.findIndex((q,i)=>i>pIdx&&!S.solved[q.id]);const nx=n>=0?n:cur.problems.findIndex(q=>!S.solved[q.id]);
  const more=nx>=0?`<button class="btn primary" id="goNext">Next ${esc(cur.topic.name.toLowerCase())} problem →</button>`
    :`<div class="helpbox"><b>Every ${esc(cur.topic.name.toLowerCase())} problem solved.</b> Pick another topic above.</div>`;
  $("#results").insertAdjacentHTML("beforeend",`<div class="actions">${more}</div>`);
  if($("#goNext"))$("#goNext").onclick=()=>{pIdx=nx;S.prob[cur.key]=pIdx;save();renderProblem();$("#ptitle").scrollIntoView({block:"start"});};
}

// ---------- all days ----------
function renderDays(){
  const nd=nextDay();
  const weeks=[["Week 1","Talking to the computer"],["Week 2","Decisions and repetition"],["Week 3","Collections and functions"],["Week 4","Real-world Python"]];
  $("#view-days").innerHTML=`<div class="weeks">${weeks.map((w,wi)=>`
    <div class="week"><h3>${w[0]}: ${w[1]}<small>${COURSE.filter(d=>d.week===wi+1).filter(dayDone).length}/${COURSE.filter(d=>d.week===wi+1).length} DAYS DONE</small></h3>
    <div class="days">${COURSE.filter(d=>d.week===wi+1).map(d=>`
      <button class="daytile ${dayDone(d)?"done":""} ${d.day===nd&&!dayDone(d)?"today":""}" data-day="${d.day}">
        <span class="dn">${String(d.day).padStart(2,"0")}</span><span class="tt">${esc(d.title)}</span>
        <span class="dots">${d.problems.map(p=>`<i class="${S.solved[p.id]?"on":""}"></i>`).join("")}</span>
      </button>`).join("")}</div></div>`).join("")}</div>`;
  document.querySelectorAll(".daytile").forEach(t=>t.onclick=()=>{show("today");renderDay(+t.dataset.day);});
}

// ---------- resources ----------
function renderRes(){
  $("#view-res").innerHTML=`
  <div class="res-intro"><div class="eyebrow">Hand-picked, all beginner-first</div><h2>Where to learn alongside this site</h2>
  <p>Each day's lesson links to matching videos. These are the full courses behind them. Start with one English and one Hindi source; switching between many courses is a common way to stall.</p></div>
  <div class="rgrid">${RESOURCES.map(r=>`
    <div class="rcard ${r.pick?"pick":""}"><div class="chips">${r.pick?'<span class="chip pick">START HERE</span>':""}<span class="chip">${esc(r.lang.toUpperCase())}</span><span class="chip">${esc(r.cost.toUpperCase())}</span></div>
    <h3>${esc(r.name)}</h3><div class="who">${esc(r.who)}</div><p>${esc(r.why)}</p>
    <div class="links">${r.links.map(l=>`<a class="btn" href="${l[1]}" target="_blank" rel="noopener">${esc(l[0])} ↗</a>`).join("")}</div></div>`).join("")}</div>
  <div class="plan"><span class="eyebrow">A daily routine that works (about 1 hour)</span>
  <ol><li>Watch the matching video section (20 min). Pause and type along.</li>
  <li>Read the day's lesson here and run the example; change something and run it again (10 min).</li>
  <li>Solve the three problems without looking at solutions (30 min). Use the hint first.</li>
  <li>Next morning, redo yesterday's hardest problem from a blank editor (5 min).</li></ol></div>`;
}

// ---------- reset ----------
$("#resetBtn").onclick=()=>{
  $("#resetArea").innerHTML=`<span>Erase all solved problems, code and streak? </span><button class="linkbtn" id="rsYes" type="button">Yes, erase</button> · <button class="linkbtn" id="rsNo" type="button">Cancel</button>`;
  $("#rsYes").onclick=()=>{try{localStorage.removeItem(KEY);}catch(e){}location.reload();};
  $("#rsNo").onclick=()=>{$("#resetArea").innerHTML='<button class="linkbtn" id="resetBtn" type="button">Reset all progress</button>';location.reload();};
};

// ---------- boot ----------
meters();renderRes();
let v="today";try{v=localStorage.getItem(KEY+"-view")||"today";}catch(e){}
if(v==="practice")renderPractice(S.ptopic||"loops");else renderDay(S.current&&S.current>=1&&S.current<=30?S.current:nextDay());
if(v!=="today")show(v);
})();
</script>
